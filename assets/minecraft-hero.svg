<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="ZINZIN Software Engineering Minecraft-style animated landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081526"/>
      <stop offset="58%" stop-color="#12345A"/>
      <stop offset="100%" stop-color="#245A78"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity=".65"/>
    </filter>
    <style>
      .pixel{shape-rendering:crispEdges}
      .cloud-a{animation:cloudA 18s linear infinite}
      .cloud-b{animation:cloudB 25s linear infinite}
      .sun{animation:sunFloat 7s ease-in-out infinite}
      .spark-1{animation:spark 3.6s steps(2,end) infinite}
      .spark-2{animation:spark 4.7s steps(2,end) infinite 1.1s}
      .spark-3{animation:spark 5.2s steps(2,end) infinite 2.1s}
      .tree-top{animation:treeSway 4.8s steps(3,end) infinite}
      .title{animation:titlePulse 5s ease-in-out infinite}
      @keyframes cloudA{0%{transform:translateX(-170px)}100%{transform:translateX(940px)}}
      @keyframes cloudB{0%{transform:translateX(930px)}100%{transform:translateX(-230px)}}
      @keyframes sunFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes spark{0%,30%,100%{opacity:.15;transform:translateY(0)}45%,65%{opacity:1;transform:translateY(-5px)}}
      @keyframes treeSway{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
      @keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 0 #67E8F9)}50%{filter:drop-shadow(0 0 7px #67E8F9)}}
      @media (prefers-reduced-motion: reduce){
        .cloud-a,.cloud-b,.sun,.spark-1,.spark-2,.spark-3,.tree-top,.title{animation:none!important}
      }
    </style>
  </defs>

  <rect width="900" height="230" fill="url(#sky)"/>

  <!-- pixel stars -->
  <g class="pixel" fill="#CFFAFE">
    <rect class="spark-1" x="78" y="34" width="4" height="4"/>
    <rect class="spark-2" x="190" y="62" width="3" height="3"/>
    <rect class="spark-3" x="706" y="40" width="4" height="4"/>
    <rect class="spark-1" x="816" y="72" width="3" height="3"/>
    <rect class="spark-2" x="620" y="26" width="3" height="3"/>
  </g>

  <!-- sun -->
  <g class="sun pixel" transform="translate(760 38)">
    <rect x="0" y="0" width="42" height="42" fill="url(#sunGlow)"/>
    <rect x="-5" y="10" width="5" height="22" fill="#FDE68A" opacity=".55"/>
    <rect x="42" y="10" width="5" height="22" fill="#FDE68A" opacity=".55"/>
    <rect x="10" y="-5" width="22" height="5" fill="#FDE68A" opacity=".55"/>
    <rect x="10" y="42" width="22" height="5" fill="#FDE68A" opacity=".55"/>
  </g>

  <!-- drifting clouds -->
  <g class="cloud-a pixel" opacity=".72" fill="#DDF4FF">
    <rect x="0" y="50" width="70" height="16"/>
    <rect x="16" y="38" width="38" height="16"/>
    <rect x="31" y="30" width="22" height="12"/>
  </g>
  <g class="cloud-b pixel" opacity=".48" fill="#DDF4FF">
    <rect x="0" y="78" width="92" height="14"/>
    <rect x="18" y="66" width="52" height="14"/>
    <rect x="42" y="57" width="26" height="12"/>
  </g>

  <!-- distant voxel hills -->
  <g class="pixel">
    <path d="M0 151H84V137H128V125H190V147H246V132H314V151H390V142H452V128H514V151H588V139H652V119H716V151H782V134H846V151H900V230H0Z" fill="#173D35"/>
    <path d="M0 170H108V153H167V165H232V146H291V170H369V157H430V169H505V148H568V166H633V151H704V169H776V153H840V168H900V230H0Z" fill="#245D3D"/>
  </g>

  <!-- block ground -->
  <g class="pixel">
    <rect x="0" y="178" width="900" height="16" fill="#4D7C0F"/>
    <rect x="0" y="194" width="900" height="36" fill="#6B4423"/>
    <g fill="#7C532B">
      <rect x="18" y="201" width="18" height="9"/><rect x="93" y="214" width="14" height="8"/>
      <rect x="156" y="198" width="21" height="10"/><rect x="252" y="217" width="17" height="9"/>
      <rect x="332" y="202" width="18" height="8"/><rect x="418" y="215" width="22" height="8"/>
      <rect x="528" y="200" width="14" height="10"/><rect x="612" y="214" width="20" height="8"/>
      <rect x="710" y="201" width="18" height="9"/><rect x="816" y="216" width="20" height="8"/>
    </g>
    <g fill="#3F6212">
      <rect x="0" y="178" width="90" height="5"/><rect x="112" y="178" width="96" height="5"/>
      <rect x="233" y="178" width="75" height="5"/><rect x="329" y="178" width="118" height="5"/>
      <rect x="470" y="178" width="89" height="5"/><rect x="586" y="178" width="103" height="5"/>
      <rect x="711" y="178" width="72" height="5"/><rect x="806" y="178" width="94" height="5"/>
    </g>
  </g>

  <!-- voxel trees -->
  <g class="pixel" transform="translate(86 116)">
    <rect x="24" y="27" width="12" height="62" fill="#6B4423"/>
    <g class="tree-top" fill="#166534">
      <rect x="0" y="14" width="58" height="22"/>
      <rect x="10" y="0" width="38" height="20"/>
      <rect x="13" y="34" width="34" height="17"/>
    </g>
    <g class="tree-top" fill="#15803D" opacity=".75">
      <rect x="7" y="17" width="17" height="12"/>
      <rect x="27" y="5" width="15" height="11"/>
    </g>
  </g>
  <g class="pixel" transform="translate(755 128) scale(.78)">
    <rect x="24" y="27" width="12" height="62" fill="#6B4423"/>
    <g class="tree-top" fill="#166534">
      <rect x="0" y="14" width="58" height="22"/>
      <rect x="10" y="0" width="38" height="20"/>
      <rect x="13" y="34" width="34" height="17"/>
    </g>
  </g>

  <!-- small farm details -->
  <g class="pixel" transform="translate(650 148)">
    <rect x="0" y="14" width="54" height="30" fill="#991B1B"/>
    <path d="M-8 14L27-8L62 14Z" fill="#292524"/>
    <rect x="20" y="25" width="15" height="19" fill="#7F1D1D" stroke="#F8FAFC" stroke-width="2"/>
  </g>
  <g class="pixel" transform="translate(186 166)">
    <rect x="0" y="0" width="92" height="12" fill="#6B4423"/>
    <rect x="12" y="-9" width="4" height="9" fill="#65A30D"/>
    <rect x="27" y="-14" width="4" height="14" fill="#84CC16"/>
    <rect x="42" y="-8" width="4" height="8" fill="#65A30D"/>
    <rect x="57" y="-13" width="4" height="13" fill="#A3E635"/>
    <rect x="72" y="-10" width="4" height="10" fill="#65A30D"/>
  </g>

  <!-- center readability panel -->
  <rect x="255" y="58" width="390" height="92" rx="4" fill="#020617" opacity=".56" stroke="#164E63" stroke-width="1"/>

  <g class="title" filter="url(#shadow)">
    <text x="450" y="108" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="2" fill="#CFFAFE">ZINZIN</text>
    <text x="450" y="134" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="17" font-weight="700" fill="#E2E8F0">Software Engineering</text>
  </g>

  <!-- tiny pixel particles -->
  <g class="pixel">
    <rect class="spark-1" x="320" y="42" width="5" height="5" fill="#22D3EE"/>
    <rect class="spark-2" x="570" y="48" width="4" height="4" fill="#A78BFA"/>
    <rect class="spark-3" x="607" y="92" width="4" height="4" fill="#67E8F9"/>
  </g>
</svg>