name: Generate contribution mine

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/minecraftify_contributions.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution animation source
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vinh17491
          outputs: |
            dist/github-contribution-mine.svg?color_snake=%2384CC16&color_dots=%23d6d3d1,%23795548,%2378716c,%2316a34a,%2322d3ee
            dist/github-contribution-mine-dark.svg?palette=github-dark&color_snake=%2384CC16&color_dots=%231c1917,%235b4636,%2357534e,%2316a34a,%2322d3ee

      - name: Convert to voxel mining animation
        run: |
          python .github/scripts/minecraftify_contributions.py \
            dist/github-contribution-mine.svg \
            dist/github-contribution-mine-dark.svg

      - name: Publish contribution mine
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
